spring:
  datasource:
    url: jdbc:h2:mem:chocolate_shop;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false

app:
  jwt:
    secret: test-only-signing-secret-with-at-least-thirty-two-bytes
  cors:
    allowed-origins: http://localhost:4200
